name: Deploy to GitHub Pages

# Builds the static export and publishes it to GitHub Pages.
#
# One-time setup (repo owner): Settings → Pages → Build and deployment →
# Source → "GitHub Actions". After that, every push to the branch below
# redeploys automatically. You can also run it manually from the Actions tab
# (workflow_dispatch).

on:
  push:
    branches:
      - claude/arksim-landing-page-gffj0h
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      # Static hosting: skip Jekyll processing of the _next/ directory.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
